<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1 kHz tone (phone audio test)</title>
<style>body{background:#111;color:#ddd;font:16px sans-serif;margin:20px}</style>
</head>
<body>
<h3>Phone sound to the PC: 3 s 1 kHz tone</h3>
<p id="s">building the WAV...</p>
<button id="b" style="font-size:18px;padding:8px 16px">Play 3 s tone</button>
<script>
  // A 3 s 1 kHz mono WAV at 48000 Hz, amplitude 0.05 (-26 dBFS), generated in the page.
  function makeWav(seconds, freq, amp) {
    var rate = 48000, n = rate * seconds;
    var buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
    function str(o, s) { for (var i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); }
    str(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
    str(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
    dv.setUint16(22, 1, true); dv.setUint32(24, rate, true);
    dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    str(36, 'data'); dv.setUint32(40, n * 2, true);
    for (var i = 0; i < n; i++) {
      var v = Math.sin(2 * Math.PI * freq * i / rate) * amp * 32767;
      dv.setInt16(44 + i * 2, v, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  var url = makeWav(3, 1000, 0.05);
  var a = new Audio(url);
  a.volume = 0.6;
  function report(ev) {
    if (window.UdBridge && window.UdBridge.report) window.UdBridge.report(ev);
  }
  function play() {
    a.currentTime = 0;
    a.play().then(function () { report('tone-start'); })
      .catch(function (e) { document.getElementById('s').textContent = 'play failed: ' + e; });
  }
  a.onended = function () { report('tone-end'); document.getElementById('s').textContent = 'tone finished'; };
  document.getElementById('b').onclick = play;
  document.getElementById('s').textContent = 'ready; autoplay in 0.6 s';
  setTimeout(play, 600);
</script>
</body>
</html>
